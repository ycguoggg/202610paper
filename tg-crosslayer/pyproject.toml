[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-crosslayer"
version = "0.1.0"
description = "Cross-layer analysis of Telegram-derived Android clients and backend endpoint pools"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tg-crosslayer = "tg_crosslayer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
